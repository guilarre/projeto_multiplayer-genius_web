# Integracao continua: roda os testes unitarios a cada push e pull request
name: Testes
on: [push, pull_request]
jobs:
  unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
